<!-- Google Sheets से सूचना प्राप्त करें -->
<script>
(function () {

    const API_URL = "https://script.google.com/macros/s/AKfycbwwXxC6cWgL1iua1ZK2xoCaIf2YoO9987jaASsD-5jbT-tJCaHHOIeibhvje6mM8DUn8Q/exec";

    const titleBox = document.getElementById("noticeTitle");
    const descriptionBox = document.getElementById("noticeDescription");

    window.loadMPNotice = function(data) {

        if (data && data.title && data.description) {
            titleBox.textContent = data.title;
            descriptionBox.textContent = data.description;
        } else {
            titleBox.textContent = "कोई नई सूचना उपलब्ध नहीं है";
            descriptionBox.textContent = "";
        }

    };

    const script = document.createElement("script");

    script.src = API_URL +
        (API_URL.includes("?") ? "&" : "?") +
        "callback=loadMPNotice&_=" + Date.now();

    script.onerror = function() {
        titleBox.textContent = "सूचना लोड नहीं हो सकी";
        descriptionBox.textContent =
            "कृपया कुछ समय बाद पुनः प्रयास करें।";
    };

    document.body.appendChild(script);

})();
</script>
